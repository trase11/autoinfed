name: Έλεγχος ανακοινώσεων

on:
  schedule:
    # Κάθε 5 λεπτά (το ελάχιστο που επιτρέπει το GitHub). Στην πράξη το GitHub
    # συχνά καθυστερεί ή παραλείπει εκτελέσεις, οπότε η απάντηση έρχεται σε ~5-20'.
    # Διπλά posts δεν γίνονται: το state + ο έλεγχος λεζαντών το αποκλείουν.
    - cron: "*/5 * * * *"
  workflow_dispatch:          # κουμπί "Run workflow" ή ο Cloudflare Worker (άμεσα)
    inputs:
      wait_for:
        description: "update_id του Telegram που ξεκίνησε την εκτέλεση (από τον Worker)"
        required: false
        default: ""
      check_tokens:
        description: "1 = μόνο έλεγχος των tokens του Instagram (διάγνωση)"
        required: false
        default: ""

permissions:
  contents: write             # για να αποθηκεύει εικόνες και state στο repo

concurrency:
  group: announce
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Πάντα η πιο πρόσφατη εκδοχή του main, όχι αυτή της στιγμής που ζητήθηκε η
          # εκτέλεση: αλλιώς μια εκτέλεση που περίμενε στην ουρά βλέπει παλιό state
          # και ξαναδημοσιεύει ό,τι ανέβασε η προηγούμενη.
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: git identity
        run: |
          git config user.name  "announcer-bot"
          git config user.email "announcer-bot@users.noreply.github.com"

      - name: Έλεγχος & δημοσίευση
        env:
          IG_TOKENS: ${{ secrets.IG_TOKENS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ECLASS_RSS: ${{ secrets.ECLASS_RSS }}
          WAIT_FOR: ${{ github.event.inputs.wait_for }}
          CHECK_TOKENS: ${{ github.event.inputs.check_tokens }}
        run: python announcer.py

      - name: Αποθήκευση state
        if: always()
        run: |
          git add state/
          git diff --cached --quiet || git commit -q -m "state $(date -u +%FT%H:%M)"
          git pull -q --rebase && git push -q
