name: Έλεγχος ανακοινώσεων

on:
  schedule:
    # Κάθε 15 λεπτά. Το GitHub συχνά καθυστερεί ή παραλείπει προγραμματισμένες
    # εκτελέσεις, οπότε με 4 προσπάθειες την ώρα γίνεται σίγουρα τουλάχιστον μία.
    # Διπλά posts δεν γίνονται: το state + ο έλεγχος λεζαντών το αποκλείουν.
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:          # κουμπί "Run workflow" για χειροκίνητη εκτέλεση

permissions:
  contents: write             # για να αποθηκεύει εικόνες και state στο repo

concurrency:
  group: announce
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: git identity
        run: |
          git config user.name  "announcer-bot"
          git config user.email "announcer-bot@users.noreply.github.com"

      - name: Έλεγχος & δημοσίευση
        env:
          IG_TOKENS: ${{ secrets.IG_TOKENS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python announcer.py

      - name: Αποθήκευση state
        if: always()
        run: |
          git add state/
          git diff --cached --quiet || git commit -q -m "state $(date -u +%FT%H:%M)"
          git pull -q --rebase && git push -q
